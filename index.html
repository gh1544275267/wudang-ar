<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武当 · 虚空驭气</title>
    <script src="https://cdn.staticfile.org/aframe/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <style>
        :root { --gold: #d4af37; }
        body { margin: 0; overflow: hidden; background: #000; font-family: "PingFang SC", sans-serif; }
        
        /* 核心：摄像头背景全屏 */
        #input_video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -1;
            transform: scaleX(-1); /* 镜像翻转，像照镜子一样自然 */
        }

        /* UI层 */
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }
        .header { position: absolute; top: 30px; left: 30px; border-left: 2px solid var(--gold); padding-left: 12px; }
        .header h1 { color: var(--gold); font-size: 20px; margin: 0; letter-spacing: 4px; font-weight: 300; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        #status-info {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: #fff; font-size: 12px; letter-spacing: 2px;
        }
        .mode-text { color: var(--gold); font-size: 18px; display: block; margin-top: 5px; text-shadow: 0 0 8px rgba(0,0,0,0.8); }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--gold);
        }
    </style>
</head>
<body>

    <div id="loader">
        <div style="font-size: 18px; letter-spacing: 5px;">正在开启气场感应...</div>
    </div>

    <!-- 实时摄像头源 -->
    <video id="input_video" playsinline></video>

    <div id="ui-layer">
        <div class="header">
            <h1>武当 · 虚空驭气</h1>
            <p style="color:rgba(255,255,255,0.6); margin:0; font-size:9px;">WUDANG SPIRIT AR</p>
        </div>
        
        <div id="status-info">
            <span id="track-stat">正在寻觅内力...</span>
            <span class="mode-text" id="cur-mode">起势调息</span>
        </div>
    </div>

    <a-scene renderer="antialias: true; alpha: true" vr-mode-ui="enabled: false">
        <a-entity id="ar-world">
            <!-- 手部追踪锚点 -->
            <a-entity id="hand-point">
                <a-sphere radius="0.03" material="color:#fff; emissive:#fff; emissiveIntensity:2"></a-sphere>
                <a-light type="point" color="#d4af37" intensity="2" distance="5"></a-light>
            </a-entity>
            <!-- 粒子容器 -->
            <a-entity id="particles-node"></a-entity>
        </a-entity>
        <a-camera fov="60" look-controls="enabled: false" position="0 0 0"></a-camera>
    </a-scene>

    <script>
        const videoElement = document.getElementById('input_video');
        const trackStat = document.getElementById('track-stat');
        const modeText = document.getElementById('cur-mode');
        
        let mode = 'breath'; // breath, flow, strike
        let rawHandPos = new THREE.Vector3(0, 0, -1.2);
        let smoothHandPos = new THREE.Vector3(0, 0, -1.2);

        // 1. 粒子系统设置 (更震撼的视觉)
        const count = 6000;
        const container = document.querySelector('#particles-node').object3D;
        const geo = new THREE.BufferGeometry();
        const posArr = new Float32Array(count * 3);
        const vels = [];

        for(let i=0; i<count; i++) {
            posArr[i*3] = (Math.random()-0.5) * 2;
            posArr[i*3+1] = (Math.random()-0.5) * 2;
            posArr[i*3+2] = -1.2;
            vels.push(new THREE.Vector3(0,0,0));
        }

        geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
        const mat = new THREE.PointsMaterial({
            color: 0xd4af37, size: 0.015, transparent: true, opacity: 0.7,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        const points = new THREE.Points(geo, mat);
        container.add(points);

        // 2. MediaPipe 手势逻辑
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        
        hands.onResults(results => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                trackStat.innerText = "内力已感应";
                const lm = results.multiHandLandmarks[0][9];
                // 关键点：镜像对齐转换
                // 因为视频 scaleX(-1)，所以这里 lm.x 越小其实是在画面右边，需要对应转换
                rawHandPos.x = (lm.x - 0.5) * -2.8; 
                rawHandPos.y = (0.5 - lm.y) * 2.2;

                const thumb = results.multiHandLandmarks[0][4];
                const index = results.multiHandLandmarks[0][8];
                const dist = Math.sqrt(Math.pow(thumb.x-index.x,2) + Math.pow(thumb.y-index.y,2));

                if(dist < 0.06) {
                    mode = 'strike'; modeText.innerText = "瞬时发劲";
                } else {
                    mode = 'flow'; modeText.innerText = "云手连绵";
                }
            } else {
                trackStat.innerText = "正在寻觅内力...";
                mode = 'breath'; modeText.innerText = "起势调息";
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });
        camera.start().then(() => document.getElementById('loader').style.display = 'none');

        // 3. 实时动力学动画
        function animate() {
            const positions = points.geometry.attributes.position.array;
            const time = Date.now() * 0.001;

            // 插值平滑
            smoothHandPos.lerp(rawHandPos, 0.15);
            document.querySelector('#hand-point').object3D.position.copy(smoothHandPos);

            for(let i=0; i<count; i++) {
                const i3 = i * 3;
                const v = vels[i];
                const dx = smoothHandPos.x - positions[i3];
                const dy = smoothHandPos.y - positions[i3+1];
                
                if(mode === 'strike') {
                    // 气势：顺着手部喷涌
                    v.x += (positions[i3] - smoothHandPos.x) * 0.15;
                    v.y += (positions[i3+1] - smoothHandPos.y) * 0.15;
                    if(Math.abs(positions[i3]) > 3) {
                        positions[i3] = smoothHandPos.x; 
                        positions[i3+1] = smoothHandPos.y;
                        v.set(0,0,0);
                    }
                } else if(mode === 'flow') {
                    // 转折：云手旋涡
                    const angle = 0.06;
                    const rx = dx * Math.cos(angle) - dy * Math.sin(angle);
                    const ry = dx * Math.sin(angle) + dy * Math.cos(angle);
                    positions[i3] += (rx - dx) + dx * 0.02;
                    positions[i3+1] += (ry - dy) + dy * 0.02;
                    v.multiplyScalar(0.9);
                } else {
                    // 气息：聚散律动
                    const noise = Math.sin(time + i) * 0.002;
                    v.x += dx * 0.001 + noise;
                    v.y += dy * 0.001 + noise;
                    v.multiplyScalar(0.95);
                }

                positions[i3] += v.x;
                positions[i3+1] += v.y;
            }

            points.geometry.attributes.position.needsUpdate = true;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
