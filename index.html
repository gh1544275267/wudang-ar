<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武当气韵 AR (国内加速版)</title>
    <!-- 替换为国内镜像源的 A-Frame -->
    <script src="https://cdn.staticfile.org/aframe/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: "PingFang SC", sans-serif; }
        .ui-panel {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: none; gap: 15px; z-index: 100;
        }
        button {
            background: rgba(0,0,0,0.85); color: #d4af37; border: 1px solid #d4af37;
            padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: bold;
            box-shadow: 0 0 10px rgba(212,175,55,0.3);
        }
        #instructions {
            position: fixed; top: 0; left: 0; width: 100%; text-align: center;
            color: #d4af37; background: rgba(0,0,0,0.7); padding: 15px 0; z-index: 100;
            font-size: 14px; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="instructions">正在感应地面... 请缓慢左右移动手机</div>

    <div class="ui-panel" id="controls">
        <button onclick="changeMode('breath')">调息</button>
        <button onclick="changeMode('flow')">圆转</button>
        <button onclick="changeMode('strike')">发力</button>
    </div>

    <a-scene webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #controls">
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity id="reticle" visible="false">
            <a-ring color="#d4af37" rotation="-90 0 0" radius-inner="0.08" radius-outer="0.12"></a-ring>
        </a-entity>
        <a-entity id="wudang-content" visible="false">
            <a-circle rotation="-90 0 0" radius="0.8" material="color: #d4af37; transparent: true; opacity: 0.6; src: url(https://img.alicdn.com/imgextra/i3/O1CN01SclzO61XW9P1q7Ie7_!!6000000002930-2-tps-512-512.png)"></a-circle>
            <a-entity id="particles-node"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const reticle = document.querySelector('#reticle');
        const content = document.querySelector('#wudang-content');
        const instructions = document.querySelector('#instructions');
        const controls = document.querySelector('#controls');
        let mode = 'breath';
        let isPlaced = false;

        scene.addEventListener('enter-vr', () => {
            const session = scene.xrSession;
            session.addEventListener('select', () => {
                if (!isPlaced && reticle.getAttribute('visible')) {
                    content.setAttribute('position', reticle.getAttribute('position'));
                    content.setAttribute('visible', true);
                    isPlaced = true;
                    reticle.setAttribute('visible', false);
                    instructions.style.display = 'none';
                    controls.style.display = 'flex';
                    startParticleSim();
                }
            });
        });

        scene.addEventListener('render-target-loaded', () => {
            scene.renderer.setAnimationLoop((time, frame) => {
                if (isPlaced || !frame) return;
                const session = scene.xrSession;
                if (!session) return;
                const refSpace = scene.renderer.xr.getReferenceSpace();
                const hitTestSources = scene.systems.webxr.session.hitTestSources;
                if (hitTestSources && hitTestSources.length > 0) {
                    const results = frame.getHitTestResults(hitTestSources[0]);
                    if (results.length > 0) {
                        const pose = results[0].getPose(refSpace);
                        reticle.setAttribute('visible', true);
                        reticle.setAttribute('position', pose.transform.position);
                        instructions.innerText = "已锁定地面，点击屏幕开启气场";
                    }
                }
            });
        });

        function startParticleSim() {
            const container = document.querySelector('#particles-node').object3D;
            const count = 1000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) pos[i] = (Math.random()-0.5)*1.5;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({color: 0xd4af37, size: 0.02, transparent: true, blending: THREE.AdditiveBlending});
            const points = new THREE.Points(geo, mat);
            container.add(points);

            function frame() {
                const arr = points.geometry.attributes.position.array;
                for(let i=0; i<count; i++) {
                    let ix = i*3, iy = i*3+1, iz = i*3+2;
                    if(mode === 'breath') { arr[iy] += Math.sin(Date.now()*0.002 + arr[ix])*0.001; }
                    else if(mode === 'flow') { let x=arr[ix], z=arr[iz]; arr[ix]=x*0.98-z*0.05; arr[iz]=x*0.05+z*0.98; }
                    else if(mode === 'strike') { arr[ix]*=1.1; arr[iy]*=1.1; arr[iz]*=1.1; if(Math.abs(arr[ix])>2) arr[ix]*=0.1; }
                }
                points.geometry.attributes.position.needsUpdate = true;
                requestAnimationFrame(frame);
            }
            frame();
        }
        function changeMode(m) { mode = m; if(m === 'strike') setTimeout(()=>mode='breath', 800); }
    </script>
</body>
</html>
