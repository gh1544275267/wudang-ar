<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武当 · 悬浮气韵</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: "PingFang SC", sans-serif; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); z-index: 1000; transition: 0.5s;
        }
        .title { color: #d4af37; font-size: 24px; letter-spacing: 8px; margin-bottom: 20px; text-shadow: 0 0 15px rgba(212,175,55,0.5); }
        .start-btn {
            background: none; border: 1px solid #d4af37; color: #d4af37;
            padding: 15px 40px; border-radius: 30px; font-size: 16px; cursor: pointer;
        }
        .ui-panel {
            position: fixed; bottom: 40px; left: 0; width: 100%;
            display: none; justify-content: center; gap: 20px; z-index: 100;
        }
        .control-btn {
            background: rgba(0,0,0,0.6); color: #d4af37; border: 1px solid #d4af37;
            padding: 12px 20px; border-radius: 20px; font-size: 14px; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="title">武当 · 气韵空间</div>
        <button class="start-btn" onclick="enterAR()">开启气场</button>
        <p style="color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 20px;">建议在 Chrome 或浏览器中打开</p>
    </div>

    <div class="ui-panel" id="ui">
        <button class="control-btn" onclick="setMode('breath')">调息</button>
        <button class="control-btn" onclick="setMode('flow')">转折</button>
        <button class="control-btn" onclick="setMode('strike')">发力</button>
    </div>

    <!-- AR 场景：关闭 hit-test，使用普通 AR 模式 -->
    <a-scene webxr="optionalFeatures: dom-overlay; overlayElement: #ui" renderer="antialias: true; alpha: true">
        
        <!-- 核心气场容器：默认放在前方 2 米处 -->
        <a-entity id="wudang-core" position="0 1.2 -2" visible="false">
            
            <!-- 浮动八卦盘 -->
            <a-entity id="bagua-plate" rotation="-90 0 0">
                <a-ring color="#d4af37" radius-inner="0.45" radius-outer="0.5" opacity="0.8"></a-ring>
                <a-circle radius="0.48" material="color: #d4af37; transparent: true; opacity: 0.2; src: url(https://img.alicdn.com/imgextra/i3/O1CN01SclzO61XW9P1q7Ie7_!!6000000002930-2-tps-512-512.png)"></a-circle>
            </a-entity>

            <!-- 动态粒子承载器 -->
            <a-entity id="particle-node"></a-entity>

            <!-- 环境光源 -->
            <a-light type="point" color="#ffd700" intensity="1.5" distance="5"></a-light>
        </a-entity>

        <a-camera look-controls="enabled: true"></a-camera>
    </a-scene>

    <script>
        let mode = 'breath';
        const scene = document.querySelector('a-scene');
        const core = document.querySelector('#wudang-core');
        const overlay = document.querySelector('#overlay');
        const ui = document.querySelector('#ui');

        function enterAR() {
            // 进入 AR 模式
            scene.enterVR();
            
            // 立即显示内容并定位在视野正前方
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                ui.style.display = 'flex';
                core.setAttribute('visible', 'true');
                
                // 将内容放置在当前相机面对的方向
                const camera = document.querySelector('[camera]');
                const position = new THREE.Vector3(0, 0, -1.8); // 1.8米远
                position.applyQuaternion(camera.object3D.quaternion);
                position.add(camera.object3D.position);
                core.setAttribute('position', position);
                
                initParticles();
            }, 500);
        }

        function initParticles() {
            const container = document.querySelector('#particle-node').object3D;
            const count = 1200;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const vels = [];

            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5) * 1.5;
                pos[i*3+1] = (Math.random()-0.5) * 1.5;
                pos[i*3+2] = (Math.random()-0.5) * 1.5;
                vels.push(new THREE.Vector3(0,0,0));
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xd4af37, 
                size: 0.02, 
                transparent: true, 
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            const points = new THREE.Points(geo, mat);
            container.add(points);

            function animate() {
                const arr = points.geometry.attributes.position.array;
                const time = Date.now() * 0.001;

                for(let i=0; i<count; i++) {
                    const i3 = i * 3;
                    if(mode === 'breath') {
                        // 气息：球体律动
                        const s = 1 + Math.sin(time + arr[i3]) * 0.002;
                        arr[i3] *= s; arr[i3+1] *= s; arr[i3+2] *= s;
                    } 
                    else if(mode === 'flow') {
                        // 转折：旋转流场
                        const x = arr[i3], z = arr[i3+2];
                        arr[i3] = x * 0.99 - z * 0.04;
                        arr[i3+2] = x * 0.04 + z * 0.99;
                        arr[i3+1] += Math.cos(time + x) * 0.002;
                    }
                    else if(mode === 'strike') {
                        // 发力：向外迸发
                        arr[i3] *= 1.08; arr[i3+1] *= 1.08; arr[i3+2] *= 1.08;
                        if(Math.abs(arr[i3]) > 3) { arr[i3]*=0.1; arr[i3+1]*=0.1; arr[i3+2]*=0.1; }
                    }
                }
                points.geometry.attributes.position.needsUpdate = true;
                requestAnimationFrame(animate);
            }
            animate();
        }

        function setMode(m) {
            mode = m;
            if(m === 'strike') {
                setTimeout(() => { mode = 'breath'; }, 800);
            }
        }
    </script>
</body>
</html>
