<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武当 · 墨影流光 Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
    <style>
        :root { --gold: #d4af37; --cyan: #4dcad8; --ink: #000; }
        body { margin: 0; overflow: hidden; background: var(--ink); font-family: "PingFang SC", sans-serif; }
        
        /* 艺术化 HUD */
        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }
        .header { position: absolute; top: 40px; left: 40px; border-left: 1px solid var(--gold); padding-left: 15px; }
        .header h1 { color: var(--gold); font-size: 22px; margin: 0; letter-spacing: 6px; font-weight: 200; }
        
        /* 呼吸节奏引导环 */
        .breath-ring {
            position: absolute; top: 40px; right: 40px; width: 50px; height: 50px;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
        }
        #inner-pulse {
            width: 100%; height: 100%; background: var(--cyan); border-radius: 50%;
            transform: scale(0.4); opacity: 0.3; transition: all 2.5s ease-in-out;
        }

        /* 底部极简交互 */
        .controls {
            position: absolute; bottom: 45px; width: 100%; display: flex;
            justify-content: center; gap: 45px; pointer-events: auto;
        }
        .control-node { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .node-circle {
            width: 48px; height: 48px; border: 0.5px solid rgba(212,175,55,0.5);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); margin-bottom: 12px;
            transition: 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        .control-node:active .node-circle { transform: scale(0.8); border-color: var(--gold); box-shadow: 0 0 20px var(--gold); }
        .node-label { color: #fff; font-size: 11px; writing-mode: vertical-rl; letter-spacing: 5px; opacity: 0.6; }

        /* 引导字幕 */
        #guide-text {
            position: absolute; top: 20%; width: 100%; text-align: center;
            opacity: 0; transition: 1s;
        }
        .m-title { color: #fff; font-size: 18px; letter-spacing: 8px; margin-bottom: 5px; }
        .m-desc { color: var(--gold); font-size: 11px; letter-spacing: 2px; }

        #start-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: 1.2s;
        }
    </style>
</head>
<body>

    <div id="start-mask">
        <div style="color:var(--gold); font-size: 20px; letter-spacing: 12px; margin-bottom: 40px; font-weight: 200;">武当 · 墨影空间</div>
        <button onclick="enterAR()" style="background:none; border:0.5px solid var(--gold); color:var(--gold); padding:12px 40px; cursor:pointer; letter-spacing:4px;">开启传功</button>
    </div>

    <div id="hud">
        <div class="header">
            <h1>武当气韵</h1>
            <p style="color:rgba(255,255,255,0.3); font-size:9px; margin:0; letter-spacing:1px;">THE SPIRIT OF WUDANG</p>
        </div>
        
        <div class="breath-ring"><div id="inner-pulse"></div></div>

        <div id="guide-text">
            <div class="m-title" id="mode-name">调息</div>
            <div class="m-desc" id="mode-desc">气沉丹田 · 虚实相生</div>
        </div>

        <div class="controls" id="ui-btns" style="display:none;">
            <div class="control-node" onclick="setMode('breath')">
                <div class="node-circle"><div style="width:3px; height:3px; background:var(--cyan); border-radius:50%;"></div></div>
                <div class="node-label">调息</div>
            </div>
            <div class="control-node" onclick="setMode('flow')">
                <div class="node-circle"><div style="width:15px; height:1px; background:var(--gold); transform:rotate(-45deg);"></div></div>
                <div class="node-label">转折</div>
            </div>
            <div class="control-node" onclick="setMode('strike')">
                <div class="node-circle"><div style="width:10px; height:10px; border:1px solid var(--gold); transform:rotate(45deg);"></div></div>
                <div class="node-label">发力</div>
            </div>
        </div>
    </div>

    <a-scene webxr="optionalFeatures: dom-overlay; overlayElement: #hud" renderer="antialias: true; alpha: true">
        <a-assets>
            <!-- 替换为更高质量的水墨宗师剪影 -->
            <img id="master-1" src="https://img.alicdn.com/imgextra/i3/O1CN016x8x7v1O1Y6D0P4Tj_!!6000000001644-2-tps-400-600.png">
            <img id="master-2" src="https://img.alicdn.com/imgextra/i4/O1CN01zN1RkP1X3WpYx0E8t_!!6000000002864-2-tps-400-600.png">
            <img id="master-3" src="https://img.alicdn.com/imgextra/i4/O1CN01O0Y3o01W8rNqY0O7r_!!6000000002754-2-tps-400-600.png">
        </a-assets>

        <a-entity id="ar-container" visible="false">
            <!-- 宗师虚影 -->
            <a-image id="master-billboard" src="#master-1" position="0.6 0.4 -1.8" width="1.2" height="1.8" material="transparent:true; opacity:0.7;"></a-image>
            
            <!-- 气核粒子 -->
            <a-entity id="qi-field" position="0 0.2 -1.8"></a-entity>

            <!-- 氛围：地阵旋转 -->
            <a-entity position="0 -0.6 -1.8" rotation="-90 0 0">
                <a-circle radius="1" material="src:url(https://img.alicdn.com/imgextra/i3/O1CN01SclzO61XW9P1q7Ie7_!!6000000002930-2-tps-512-512.png); transparent:true; opacity:0.2; color:#d4af37">
                    <a-animation attribute="rotation" to="0 0 360" dur="15000" repeat="indefinite" easing="linear"></a-animation>
                </a-circle>
            </a-entity>
        </a-entity>

        <a-camera id="cam"></a-camera>
    </a-scene>

    <script>
        let mode = 'breath';
        let scene = document.querySelector('a-scene');
        let pulse = document.querySelector('#inner-pulse');
        let master = document.querySelector('#master-billboard');
        let uiBtns = document.querySelector('#ui-btns');
        let guide = document.querySelector('#guide-text');

        function enterAR() {
            scene.enterVR();
            document.querySelector('#start-mask').style.opacity = '0';
            setTimeout(() => {
                document.querySelector('#start-mask').style.display = 'none';
                uiBtns.style.display = 'flex';
                guide.style.opacity = '1';
                document.querySelector('#ar-container').setAttribute('visible', 'true');
                initPhysicsParticles();
                startBreathLoop();
            }, 1200);
        }

        function startBreathLoop() {
            setInterval(() => {
                pulse.style.transform = "scale(1.2)";
                pulse.style.opacity = "0.6";
                setTimeout(() => {
                    pulse.style.transform = "scale(0.4)";
                    pulse.style.opacity = "0.2";
                }, 2500);
            }, 5000);
        }

        function setMode(m) {
            mode = m;
            const config = {
                breath: { title: "调息", desc: "气沉丹田 · 呼吸连绵", img: "#master-1", color: "#4dcad8" },
                flow: { title: "转折", desc: "圆转如意 · 劲力不断", img: "#master-2", color: "#d4af37" },
                strike: { title: "发力", desc: "瞬间爆发 · 力贯长空", img: "#master-3", color: "#fff" }
            };
            document.querySelector('#mode-name').innerText = config[m].title;
            document.querySelector('#mode-desc').innerText = config[m].desc;
            master.setAttribute('src', config[m].img);
            
            if(m === 'strike') setTimeout(() => setMode('breath'), 2000);
        }

        function initPhysicsParticles() {
            const count = 4000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const data = [];

            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5) * 2;
                pos[i*3+1] = (Math.random()-0.5) * 2;
                pos[i*3+2] = (Math.random()-0.5) * 2;
                data.push({
                    speed: 0.005 + Math.random() * 0.01,
                    angle: Math.random() * Math.PI * 2,
                    offset: Math.random() * 100
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xd4af37, size: 0.012, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
            });
            const points = new THREE.Points(geo, mat);
            document.querySelector('#qi-field').object3D.add(points);

            function update() {
                const arr = points.geometry.attributes.position.array;
                const time = Date.now() * 0.001;

                for(let i=0; i<count; i++) {
                    const i3 = i * 3;
                    if(mode === 'breath') {
                        // 气息模式：粒子向大师中心缓慢漂移
                        arr[i3] += (Math.cos(time + data[i].offset)*0.002);
                        arr[i3+1] *= 0.997; // 缓慢下沉
                        points.material.color.set("#d4af37");
                    } 
                    else if(mode === 'flow') {
                        // 转折模式：双向气旋
                        let x = arr[i3], z = arr[i3+2];
                        arr[i3] = x * 0.985 - z * 0.05;
                        arr[i3+2] = x * 0.05 + z * 0.985;
                        arr[i3+1] += Math.sin(time + x)*0.005;
                    }
                    else if(mode === 'strike') {
                        // 发力模式：沿爆发向量瞬间加速
                        arr[i3] *= 1.12; arr[i3+1] *= 1.12; arr[i3+2] *= 1.12;
                        if(Math.abs(arr[i3]) > 4) { arr[i3]=0; arr[i3+1]=0; arr[i3+2]=0; }
                    }
                }
                points.geometry.attributes.position.needsUpdate = true;
                requestAnimationFrame(update);
            }
            update();
        }
    </script>
</body>
</html>
