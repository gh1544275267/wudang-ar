<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武当气韵 AR</title>
    <!-- 使用官方推荐的稳定版 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; background-color: #000; color: #d4af37; }
        #overlay-text {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 9999; width: 80%;
        }
        .btn-group {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: none; gap: 10px; z-index: 1000;
        }
        button {
            background: rgba(0,0,0,0.8); color: #d4af37; border: 1px solid #d4af37;
            padding: 10px 15px; border-radius: 20px; font-size: 14px;
        }
        #error-msg { color: #ff4444; display: none; margin-top: 20px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="overlay-text">
        <div id="status-text">正在感应灵气...</div>
        <div id="error-msg">抱歉，您的浏览器或手机硬件不支持无标记AR。<br>请尝试使用 Chrome 浏览器。</div>
        <button id="start-ar-btn" style="display:none; margin-top:20px;">开启 AR 空间</button>
    </div>

    <div class="btn-group" id="ui">
        <button onclick="changeMode('breath')">调息</button>
        <button onclick="changeMode('flow')">圆转</button>
        <button onclick="changeMode('strike')">发力</button>
    </div>

    <!-- AR 场景 -->
    <a-scene webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #ui">
        <a-entity id="reticle" visible="false">
            <a-ring color="#d4af37" rotation="-90 0 0" radius-inner="0.08" radius-outer="0.12"></a-ring>
        </a-entity>

        <a-entity id="content" visible="false">
            <a-circle rotation="-90 0 0" radius="0.6" material="color: #d4af37; transparent: true; opacity: 0.5;"></a-circle>
            <a-entity id="particles"></a-entity>
        </a-entity>
        
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const status = document.querySelector('#status-text');
        const startBtn = document.querySelector('#start-ar-btn');
        const errorMsg = document.querySelector('#error-msg');
        let mode = 'breath';

        // 1. 检查 WebXR 支持情况
        if (window.isSecureContext && navigator.xr) {
            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                if (supported) {
                    status.innerText = "灵气感应成功";
                    startBtn.style.display = "inline-block";
                } else {
                    showError();
                }
            });
        } else {
            showError();
        }

        function showError() {
            status.style.display = "none";
            errorMsg.style.display = "block";
        }

        // 2. 启动 AR
        startBtn.onclick = () => {
            scene.enterVR(); // 在AR模式下这就是进入AR
            status.innerText = "请缓慢移动手机，寻找地面平原";
            startBtn.style.display = "none";
        };

        // 3. 处理点击放置 (Hit-test)
        scene.addEventListener('enter-vr', () => {
            const session = scene.xrSession;
            session.addEventListener('select', () => {
                const reticle = document.querySelector('#reticle');
                const content = document.querySelector('#content');
                if (reticle.getAttribute('visible')) {
                    content.setAttribute('position', reticle.getAttribute('position'));
                    content.setAttribute('visible', true);
                    reticle.setAttribute('visible', false);
                    document.querySelector('#overlay-text').style.display = 'none';
                    document.querySelector('#ui').style.display = 'flex';
                    initParticles();
                }
            });
        });

        // 4. 实时更新准星
        scene.addEventListener('render-target-loaded', () => {
            scene.renderer.setAnimationLoop((time, frame) => {
                if (!frame || document.querySelector('#content').getAttribute('visible') === 'true') return;
                const refSpace = scene.renderer.xr.getReferenceSpace();
                const hitTestSources = scene.systems.webxr.session.hitTestSources;
                if (hitTestSources && hitTestSources.length > 0) {
                    const results = frame.getHitTestResults(hitTestSources[0]);
                    if (results.length > 0) {
                        const pose = results[0].getPose(refSpace);
                        const reticle = document.querySelector('#reticle');
                        reticle.setAttribute('visible', true);
                        reticle.setAttribute('position', pose.transform.position);
                        status.innerText = "找到地面！点击屏幕中心放置气场";
                    }
                }
            });
        });

        function initParticles() {
            const container = document.querySelector('#particles').object3D;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(600 * 3);
            for(let i=0; i<600*3; i++) pos[i] = (Math.random()-0.5);
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({color: 0xd4af37, size: 0.02, transparent: true});
            const points = new THREE.Points(geo, mat);
            container.add(points);

            function animate() {
                const arr = points.geometry.attributes.position.array;
                for(let i=0; i<200; i++){
                    let ix=i*3, iy=ix+1, iz=ix+2;
                    if(mode==='flow'){ let x=arr[ix], z=arr[iz]; arr[ix]=x*0.98-z*0.05; arr[iz]=x*0.05+z*0.98; }
                    else { arr[iy] += Math.sin(Date.now()*0.002+arr[ix])*0.001; }
                }
                points.geometry.attributes.position.needsUpdate = true;
                requestAnimationFrame(animate);
            }
            animate();
        }
        function changeMode(m) { mode = m; if(m==='strike') setTimeout(()=>mode='breath',800); }
    </script>
</body>
</html>
