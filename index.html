<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武当 · 气韵</title>
    <!-- 极速 CDN 镜像 -->
    <script src="https://cdn.staticfile.org/three.js/r128/three.min.js"></script>
    <script src="https://npm.elemecdn.com/@mediapipe/hands/hands.js"></script>
    <script src="https://npm.elemecdn.com/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <style>
        :root { --gold: #d4af37; }
        body { margin: 0; overflow: hidden; background: #000; font-family: "PingFang SC", sans-serif; }
        #video_src { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; transform: scaleX(-1); }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        
        /* 启动遮罩 */
        #mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s;
        }
        .title { color: var(--gold); font-size: 28px; letter-spacing: 12px; margin-bottom: 30px; }
        #start-btn {
            background: none; border: 1px solid var(--gold); color: var(--gold);
            padding: 15px 50px; border-radius: 4px; font-size: 16px; cursor: pointer;
            letter-spacing: 4px; display: none; /* 初始隐藏 */
        }
        #load-info { color: rgba(212,175,55,0.6); font-size: 12px; letter-spacing: 2px; }
        #msg { position: fixed; bottom: 30px; width: 100%; text-align: center; color: var(--gold); z-index: 100; font-size: 14px; text-shadow: 0 0 5px #000; }
    </style>
</head>
<body>

    <div id="mask">
        <div class="title">武当 · 气韵</div>
        <div id="load-info">正在感应天地灵气...</div>
        <button id="start-btn">开启感应</button>
    </div>

    <video id="video_src" playsinline></video>
    <div id="msg"></div>

    <script>
        const $ = (id) => document.getElementById(id);
        let scene, camera, renderer, particles, count = 3000;
        let targetPos = new THREE.Vector3(0, 0, -1.5), currentPos = new THREE.Vector3(0, 0, -1.5);
        let mode = 'breath', isHandActive = false;

        // --- 1. 场景初始化 ---
        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 动态生成粒子纹理
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'white'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.fillRect(0,0,32,32);
            const tex = new THREE.CanvasTexture(canvas);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const vels = [];
            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5)*2; pos[i*3+1] = (Math.random()-0.5)*2; pos[i*3+2] = -1.5;
                vels.push(new THREE.Vector3(0,0,0));
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            particles = new THREE.Points(geo, new THREE.PointsMaterial({
                color: 0xd4af37, size: 0.02, map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            particles.userData.vels = vels;
            scene.add(particles);
            render();
        }

        function render() {
            requestAnimationFrame(render);
            const time = Date.now() * 0.001;
            const pos = particles.geometry.attributes.position.array;
            const vels = particles.userData.vels;
            currentPos.lerp(targetPos, 0.15);

            for(let i=0; i<count; i++) {
                const i3 = i * 3; const v = vels[i];
                const dx = currentPos.x - pos[i3], dy = currentPos.y - pos[i3+1];
                if(mode === 'strike') {
                    v.x += (pos[i3] - currentPos.x) * 0.2; v.y += (pos[i3+1] - currentPos.y) * 0.2;
                    if(Math.abs(pos[i3]) > 3) { pos[i3] = currentPos.x; pos[i3+1] = currentPos.y; v.set(0,0,0); }
                } else if(isHandActive) {
                    const a = 0.06;
                    const rx = dx * Math.cos(a) - dy * Math.sin(a);
                    const ry = dx * Math.sin(a) + dy * Math.cos(a);
                    pos[i3] += (rx - dx) + dx * 0.03; pos[i3+1] += (ry - dy) + dy * 0.03;
                    v.multiplyScalar(0.8);
                } else {
                    v.x += dx * 0.005 + Math.sin(time + i) * 0.001; v.y += dy * 0.005 + Math.cos(time + i) * 0.001;
                    v.multiplyScalar(0.9);
                }
                pos[i3] += v.x; pos[i3+1] += v.y;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // --- 2. AI 引擎处理 ---
        const hands = new Hands({
            locateFile: (f) => `https://npm.elemecdn.com/@mediapipe/hands/${f}`
        });

        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(res => {
            if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                isHandActive = true;
                const lm = res.multiHandLandmarks[0][9];
                targetPos.x = (lm.x - 0.5) * -3; targetPos.y = (0.5 - lm.y) * 2.5;
                const dist = Math.sqrt(Math.pow(res.multiHandLandmarks[0][4].x - res.multiHandLandmarks[0][8].x, 2) + Math.pow(res.multiHandLandmarks[0][4].y - res.multiHandLandmarks[0][8].y, 2));
                if(dist < 0.06) { mode = 'strike'; $('msg').innerText = "发劲：气贯长虹"; }
                else { mode = 'flow'; $('msg').innerText = "云手：圆转如意"; }
            } else {
                isHandActive = false; mode = 'breath'; $('msg').innerText = "请举起手掌感应...";
            }
        });

        // --- 3. 启动逻辑 ---
        window.onload = () => {
            $('load-info').innerText = "加载完成，请点击下方开启";
            $('start-btn').style.display = "block";
        };

        $('start-btn').onclick = async () => {
            $('mask').style.opacity = '0';
            setTimeout(() => $('mask').style.display = 'none', 800);
            
            try {
                const cameraUtils = new Camera($('video_src'), {
                    onFrame: async () => { await hands.send({image: $('video_src')}); },
                    width: 480, height: 480
                });
                cameraUtils.start();
                initScene();
            } catch (err) {
                alert("摄像头开启失败，请检查浏览器权限并确保使用 HTTPS 访问。");
            }
        };
    </script>
</body>
</html>
