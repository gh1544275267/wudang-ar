<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武当 · 驭气 (国内加速版)</title>
    <!-- 替换为字节跳动/静态资源加速库 -->
    <script src="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/aframe/1.2.0/aframe.min.js"></script>
    <!-- 使用饿了么(阿里)提供的 MediaPipe 镜像 -->
    <script src="https://npm.elemecdn.com/@mediapipe/hands/hands.js"></script>
    <script src="https://npm.elemecdn.com/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #input_video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -1; transform: scaleX(-1);
        }
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }
        .info {
            position: absolute; bottom: 50px; width: 100%; text-align: center;
            color: #d4af37; text-shadow: 0 0 8px #000;
        }
        #welcome {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #d4af37;
        }
        button {
            background: rgba(212,175,55,0.1); border: 1px solid #d4af37; color: #d4af37;
            padding: 15px 40px; border-radius: 30px; font-size: 18px; margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="welcome">
        <div style="font-size: 24px; letter-spacing: 10px; font-weight: bold;">武当 · 驭气</div>
        <div id="loading-text" style="font-size: 13px; margin-top: 15px; opacity: 0.8;">正在感应内力 (同步 AI 模型)...</div>
        <button id="start-btn" style="display: none;">开启感应</button>
    </div>

    <video id="input_video" playsinline></video>

    <div id="ui-layer">
        <div class="info">
            <div id="status" style="font-size: 12px; opacity: 0.7;">初始化中...</div>
            <div id="mode-text" style="font-size: 28px; font-weight: bold; margin-top: 5px; letter-spacing: 5px;">调息</div>
        </div>
    </div>

    <a-scene renderer="antialias: false; alpha: true" vr-mode-ui="enabled: false">
        <a-entity id="anchor">
            <a-entity id="hand-glow" visible="false">
                <a-sphere radius="0.06" material="color:#fff; emissive:#fff; emissiveIntensity:2; opacity:0.6; transparent:true"></a-sphere>
                <a-light type="point" color="#d4af37" intensity="2" distance="4"></a-light>
            </a-entity>
            <a-entity id="particles"></a-entity>
        </a-entity>
        <a-camera look-controls="enabled: false" position="0 0 0"></a-camera>
    </a-scene>

    <script>
        const video = document.getElementById('input_video');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const statusText = document.getElementById('status');
        const modeText = document.getElementById('mode-text');
        
        let mode = 'breath';
        let rawPos = { x: 0, y: 0, z: -1.2 };
        let smoothPos = new THREE.Vector3(0, 0, -1.2);

        // --- 关键：使用国内镜像地址定位模型文件 ---
        const hands = new Hands({
            locateFile: (file) => {
                // 使用饿了么(阿里)的镜像源，解决模型下载卡顿
                return `https://npm.elemecdn.com/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(results => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.innerText = "内力交汇中";
                const lm = results.multiHandLandmarks[0][9];
                rawPos.x = (lm.x - 0.5) * -3.0; 
                rawPos.y = (0.5 - lm.y) * 2.5;

                const thumb = results.multiHandLandmarks[0][4];
                const index = results.multiHandLandmarks[0][8];
                const dist = Math.sqrt(Math.pow(thumb.x-index.x,2) + Math.pow(thumb.y-index.y,2));

                if(dist < 0.07) {
                    mode = 'strike'; modeText.innerText = "瞬时发劲";
                } else {
                    mode = 'flow'; modeText.innerText = "云手圆转";
                }
                document.getElementById('hand-glow').setAttribute('visible', 'true');
            } else {
                statusText.innerText = "寻找双掌中...";
                mode = 'breath'; modeText.innerText = "调息";
                document.getElementById('hand-glow').setAttribute('visible', 'false');
            }
        });

        // 手动开启，避免浏览器拦截摄像头
        startBtn.onclick = async () => {
            document.getElementById('welcome').style.opacity = '0';
            setTimeout(()=> document.getElementById('welcome').style.display = 'none', 500);
            
            const camera = new Camera(video, {
                onFrame: async () => { await hands.send({image: video}); },
                width: 480, height: 480
            });
            camera.start();
            initParticles();
            animate();
        };

        // 监测 MediaPipe 是否加载成功
        try {
            window.onload = () => {
                loadingText.innerText = "感应器就绪，请在明亮处开启";
                startBtn.style.display = "block";
            };
        } catch (e) {
            loadingText.innerText = "网络环境受限，请尝试切换移动网络";
        }

        // --- 粒子动力学 ---
        const count = 3000;
        const container = document.querySelector('#particles').object3D;
        let points;
        let vels = [];

        function initParticles() {
            const geo = new THREE.BufferGeometry();
            const posArray = new Float32Array(count * 3);
            for(let i=0; i<count; i++) {
                posArray[i*3] = (Math.random()-0.5)*2;
                posArray[i*3+1] = (Math.random()-0.5)*2;
                posArray[i*3+2] = -1.2;
                vels.push(new THREE.Vector3(0,0,0));
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xd4af37, size: 0.02, transparent: true, opacity: 0.7,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            points = new THREE.Points(geo, mat);
            container.add(points);
        }

        function animate() {
            if(!points) return;
            const arr = points.geometry.attributes.position.array;
            smoothPos.lerp(new THREE.Vector3(rawPos.x, rawPos.y, -1.2), 0.2);
            document.querySelector('#hand-glow').object3D.position.copy(smoothPos);

            for(let i=0; i<count; i++) {
                const i3 = i * 3;
                const v = vels[i];
                const dx = smoothPos.x - arr[i3];
                const dy = smoothPos.y - arr[i3+1];

                if(mode === 'strike') {
                    v.x += (arr[i3] - smoothPos.x) * 0.25;
                    v.y += (arr[i3+1] - smoothPos.y) * 0.25;
                    if(Math.abs(arr[i3]) > 4) { arr[i3] = smoothPos.x; arr[i3+1] = smoothPos.y; v.set(0,0,0); }
                } else if(mode === 'flow') {
                    const angle = 0.08;
                    const rx = dx * Math.cos(angle) - dy * Math.sin(angle);
                    const ry = dx * Math.sin(angle) + dy * Math.cos(angle);
                    arr[i3] += (rx - dx) + dx * 0.05;
                    arr[i3+1] += (ry - dy) + dy * 0.05;
                    v.multiplyScalar(0.85);
                } else {
                    v.x += dx * 0.005; v.y += dy * 0.005; v.multiplyScalar(0.9);
                }
                arr[i3] += v.x; arr[i3+1] += v.y;
            }
            points.geometry.attributes.position.needsUpdate = true;
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
