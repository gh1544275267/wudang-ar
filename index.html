<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>武当 · 墨影</title>
    <!-- 使用国内最快的静态资源库 -->
    <script src="https://lib.baomitu.com/three.js/r128/three.min.js"></script>
    <script src="https://npm.elemecdn.com/@mediapipe/hands/hands.js"></script>
    <script src="https://npm.elemecdn.com/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: "PingFang SC", sans-serif; }
        #v { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; transform: scaleX(-1); }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        
        /* 极简加载 UI */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.5s;
        }
        .logo { color: #d4af37; font-size: 24px; letter-spacing: 8px; margin-bottom: 20px; font-weight: 200; }
        .bar-container { width: 200px; height: 1px; background: rgba(212,175,55,0.2); }
        #bar { width: 0%; height: 100%; background: #d4af37; transition: width 0.3s; }
        
        #btn {
            display: none; background: none; border: 1px solid #d4af37; color: #d4af37;
            padding: 10px 30px; cursor: pointer; margin-top: 20px; letter-spacing: 2px;
        }

        #msg { position: fixed; bottom: 30px; width: 100%; text-align: center; color: #d4af37; z-index: 50; font-size: 14px; text-shadow: 0 0 5px #000; }
    </style>
</head>
<body>

<div id="loading">
    <div class="logo">武当 · 墨影</div>
    <div class="bar-container"><div id="bar"></div></div>
    <button id="btn">开启感应</button>
</div>

<video id="v" playsinline></video>
<div id="msg">加载秘籍中...</div>

<script>
    const $ = (id) => document.getElementById(id);
    let mode = 'breath', scene, camera, renderer, particles, count = 3000;
    let handX = 0, handY = 0, targetX = 0, targetY = 0, isActive = false;

    // 1. 快速初始化 3D 场景
    function initScene() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); // 关闭抗锯齿提升性能
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        for(let i=0; i<count*3; i++) pos[i] = (Math.random()-0.5) * 2;
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        
        const mat = new THREE.PointsMaterial({
            color: 0xd4af37, size: 0.02, transparent: true, opacity: 0.7,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        particles = new THREE.Points(geo, mat);
        scene.add(particles);
        animate();
    }

    // 2. 动画循环 (放在最前面以保证视觉流畅)
    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;
        const pos = particles.geometry.attributes.position.array;

        // 手部位置平滑插值 (Lerp)
        handX += (targetX - handX) * 0.2;
        handY += (targetY - handY) * 0.2;

        for(let i=0; i<count; i++) {
            const i3 = i * 3;
            const dx = handX - pos[i3];
            const dy = handY - pos[i3+1];

            if(mode === 'strike') {
                pos[i3] -= dx * 0.2; pos[i3+1] -= dy * 0.2;
                if(Math.abs(pos[i3]) > 3) { pos[i3] = handX; pos[i3+1] = handY; }
            } else if(isActive) {
                // 圆转轨迹
                const angle = 0.05;
                const rx = dx * Math.cos(angle) - dy * Math.sin(angle);
                const ry = dx * Math.sin(angle) + dy * Math.cos(angle);
                pos[i3] += (rx - dx) + dx * 0.02;
                pos[i3+1] += (ry - dy) + dy * 0.02;
            } else {
                // 调息
                pos[i3] += Math.sin(time + i) * 0.002 + dx * 0.005;
                pos[i3+1] += Math.cos(time + i) * 0.002 + dy * 0.005;
            }
        }
        particles.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }

    // 3. AI 加载策略
    const hands = new Hands({
        locateFile: (file) => `https://npm.elemecdn.com/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0, // 关键：使用最轻量的模型
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(res => {
        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
            isActive = true;
            const lm = res.multiHandLandmarks[0][9];
            targetX = (lm.x - 0.5) * -3;
            targetY = (0.5 - lm.y) * 3;
            
            const thumb = res.multiHandLandmarks[0][4];
            const index = res.multiHandLandmarks[0][8];
            const dist = Math.sqrt(Math.pow(thumb.x-index.x,2)+Math.pow(thumb.y-index.y,2));
            if(dist < 0.06) { mode = 'strike'; $('msg').innerText = "瞬时发劲"; }
            else { mode = 'flow'; $('msg').innerText = "圆转云手"; }
        } else {
            isActive = false; mode = 'breath'; $('msg').innerText = "寻找双掌...";
        }
    });

    // 进度模拟与启动
    let prog = 0;
    const timer = setInterval(() => {
        prog += 5;
        $('bar').style.width = prog + '%';
        if(prog >= 100) {
            clearInterval(timer);
            $('btn').style.display = 'block';
            $('bar').parentElement.style.display = 'none';
        }
    }, 50);

    $('btn').onclick = () => {
        $('loading').style.opacity = '0';
        setTimeout(() => $('loading').style.display = 'none', 500);
        
        const cam = new Camera($('v'), {
            onFrame: async () => { await hands.send({image: $('v')}); },
            width: 480, height: 480 // 降低识别分辨率换取极致流畅
        });
        cam.start();
        initScene();
    };

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>

</body>
</html>
